<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cria-ativos</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #080808;
      --bg2: #101010;
      --bg3: #161616;
      --bg4: #1e1e1e;
      --bg5: #252525;
      --b1: #1e1e1e;
      --b2: #2a2a2a;
      --b3: #383838;
      --b4: #484848;
      --b5: #585858;
      --t1: #f0f0f0;
      --t2: #aaaaaa;
      --t3: #666666;
      --t4: #3a3a3a;
      --line-col: rgba(110, 110, 110, 0.32);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--t1)
    }

    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden
    }

    /* SIDEBAR */
    #sidebar {
      width: 52px;
      min-width: 52px;
      background: var(--bg2);
      border-right: 1px solid var(--b1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 6px;
      z-index: 500;
      flex-shrink: 0
    }

    .sb-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 9px;
      color: var(--t4);
      letter-spacing: .12em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      margin-bottom: 4px
    }

    .sb-sep {
      width: 26px;
      height: 1px;
      background: var(--b1);
      margin: 2px 0
    }

    .sb-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--t4);
      transition: all .15s
    }

    .sb-btn:hover {
      background: var(--bg4);
      border-color: var(--b2);
      color: var(--t2)
    }

    .sb-btn.active {
      background: var(--bg4);
      border-color: var(--b3);
      color: var(--t1)
    }

    .sb-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    /* MAIN */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      min-width: 0
    }

    /* TOPBAR */
    #topbar {
      height: 42px;
      background: var(--bg2);
      border-bottom: 1px solid var(--b1);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      z-index: 400;
      flex-shrink: 0;
      position: relative
    }

    #brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: .06em;
      color: var(--t1)
    }

    #brand span {
      color: var(--t3)
    }

    #wf-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid var(--b2);
      background: var(--bg3);
      cursor: pointer;
      font-size: 11px;
      color: var(--t2);
      font-family: 'DM Sans', sans-serif;
      transition: all .15s
    }

    #wf-btn:hover {
      border-color: var(--b3);
      color: var(--t1)
    }

    #tb-right {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .tb-btn {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--b2);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      color: var(--t3);
      font-family: 'DM Sans', sans-serif;
      transition: all .15s
    }

    .tb-btn:hover {
      border-color: var(--b3);
      color: var(--t2)
    }

    .tb-btn.hi {
      border-color: var(--b3);
      color: var(--t1);
      background: var(--bg4)
    }

    /* VIEWS */
    .view {
      display: none;
      position: absolute;
      inset: 0
    }

    .view.active {
      display: block
    }

    /* BOARD VIEW */
    #board-view {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--bg)
    }

    /* SVG BEHIND — z-index 1 */
    #svg-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 4000px;
      height: 4000px;
      pointer-events: none;
      z-index: 1;
      transform-origin: 0 0;
      overflow: visible
    }

    /* CANVAS — z-index 2, cards sit here */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 4000px;
      height: 4000px;
      transform-origin: 0 0;
      z-index: 2
    }

    /* CARDS — all position:absolute inside #canvas */
    .ca-card {
      position: absolute;
      border-radius: 12px;
      border: 1px solid var(--b1);
      user-select: none
    }

    .ca-card:hover {
      border-color: var(--b2)
    }

    /* IDENTITY CARD */
    .identity-card {
      width: 220px;
      background: linear-gradient(155deg, #141414, #111111);
      border-color: #2a2a2a;
      z-index: 20
    }

    .id-section {
      padding: 8px 13px;
      border-top: 1px solid var(--b1)
    }

    .id-sec-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px
    }

    .id-sec-label {
      font-size: 8px;
      font-family: 'DM Mono', monospace;
      color: var(--t4);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 0
    }

    .id-toggle {
      width: 26px;
      height: 14px;
      border-radius: 7px;
      background: var(--b2);
      cursor: pointer;
      position: relative;
      transition: background .2s;
      flex-shrink: 0
    }
    .id-toggle.on { background: #3a5a3a }
    .id-toggle::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--t4);
      top: 2px;
      left: 2px;
      transition: all .2s
    }
    .id-toggle.on::after { left: 14px; background: #8ab88a }
    .id-sc-off { opacity: .22; pointer-events: none }

    .id-upload-box {
      width: 100%;
      height: 58px;
      border: 1px dashed var(--b2);
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      background: var(--bg);
      overflow: hidden;
      transition: border-color .15s
    }

    .id-upload-box:hover {
      border-color: var(--b3)
    }

    .id-chips {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center
    }

    .id-chip {
      padding: 3px 7px;
      border-radius: 5px;
      border: 1px solid var(--b2);
      background: var(--bg3);
      font-size: 10px;
      color: var(--t2);
      cursor: default
    }

    .id-chip-add {
      padding: 3px 7px;
      border-radius: 5px;
      border: 1px dashed var(--b2);
      font-size: 10px;
      color: var(--t4);
      cursor: pointer;
      transition: all .15s
    }

    .id-chip-add:hover {
      border-color: var(--b3);
      color: var(--t2)
    }

    .id-colors {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center
    }

    .id-swatch {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 1px solid var(--b3);
      cursor: pointer;
      flex-shrink: 0
    }

    .id-swatch-add {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 1px dashed var(--b2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--t4);
      font-size: 14px;
      transition: all .15s
    }

    .id-swatch-add:hover {
      border-color: var(--b3);
      color: var(--t2)
    }

    .id-ref-list {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .id-ref-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      background: var(--bg3);
      border-radius: 6px;
      border: 1px solid var(--b1)
    }

    .id-ref-img {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--bg4);
      flex-shrink: 0
    }

    .id-ref-name {
      font-size: 10px;
      color: var(--t2);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .id-ref-del {
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      color: var(--t4);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .id-ref-del:hover {
      color: var(--t2);
      background: var(--bg5)
    }

    .id-prompt-ta {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 10px;
      color: var(--t2);
      font-family: 'DM Mono', monospace;
      line-height: 1.65;
      resize: none;
      outline: none;
      min-height: 60px
    }

    /* connect dot on right edge */
    .id-dot {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--b3);
      border: 2px solid #080808;
      cursor: crosshair;
      z-index: 30;
      transition: background .15s
    }

    .id-dot:hover {
      background: var(--b5)
    }

    /* RESULT CARD */
    .cr-card {
      width: 230px;
      background: linear-gradient(155deg, #0e0e0e, #141414);
      z-index: 10
    }

    .cr-handle {
      padding: 9px 12px 0;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .cr-handle:active {
      cursor: grabbing
    }

    .cr-lbl {
      font-family: 'Syne', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--t4)
    }

    .cr-model {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--bg4);
      border: 1px solid var(--b2);
      color: var(--t3)
    }

    .cr-body {
      padding: 8px 12px 12px
    }

    .cr-preview {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--b1);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px
    }

    .cr-empty-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px
    }

    .cr-empty-icon {
      font-size: 22px;
      color: var(--t4)
    }

    .cr-empty-txt {
      font-size: 9px;
      color: var(--t4);
      text-align: center
    }

    .cr-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .cr-controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      margin-bottom: 7px
    }

    .cr-sel {
      background: var(--bg);
      border: 1px solid var(--b1);
      border-radius: 5px;
      color: var(--t2);
      font-size: 9px;
      font-family: 'DM Sans', sans-serif;
      padding: 3px 4px;
      outline: none;
      cursor: pointer;
      width: 100%
    }

    .cr-sel:hover {
      border-color: var(--b2)
    }

    .cr-gen-btn {
      width: 100%;
      padding: 6px;
      border-radius: 7px;
      background: var(--bg4);
      border: 1px solid var(--b2);
      color: var(--t1);
      font-family: 'Syne', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s
    }

    .cr-gen-btn:hover {
      background: var(--bg5);
      border-color: var(--b3)
    }

    .cr-gen-btn:active {
      transform: scale(.98)
    }

    .cr-gen-btn.busy {
      color: var(--t4);
      pointer-events: none
    }

    .cr-gen-btn.stop {
      background: #2a1a1a;
      border-color: #4a2a2a;
      color: #c08080
    }

    .cr-gen-btn.stop:hover {
      background: #3a2020;
      border-color: #6a3a3a
    }

    .cr-post {
      display: none;
      gap: 4px;
      margin-top: 5px
    }

    .cr-post.show {
      display: flex
    }

    .cr-pbtn {
      flex: 1;
      padding: 4px;
      border-radius: 5px;
      background: transparent;
      border: 1px solid var(--b1);
      color: var(--t3);
      font-size: 10px;
      cursor: pointer;
      transition: all .15s;
      font-family: 'DM Sans', sans-serif
    }

    .cr-pbtn:hover {
      border-color: var(--b2);
      color: var(--t2)
    }

    .alter-box {
      display: none;
      margin-top: 5px
    }

    .alter-box.open {
      display: block
    }

    .alter-ta {
      width: 100%;
      padding: 5px 7px;
      background: var(--bg);
      border: 1px solid var(--b1);
      border-radius: 6px;
      color: var(--t2);
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      resize: none;
      outline: none;
      line-height: 1.5
    }

    /* left connect dot */
    .cr-dot-left {
      position: absolute;
      left: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--b2);
      border: 2px solid #080808;
      cursor: crosshair;
      z-index: 30;
      transition: background .15s
    }

    .cr-dot-left:hover {
      background: var(--b4)
    }

    /* REF CARD */
    .ref-card {
      width: 148px;
      background: linear-gradient(145deg, #111, #171717);
      z-index: 25
    }

    .ref-handle {
      padding: 7px 10px 0;
      cursor: grab;
      display: flex;
      align-items: center
    }

    .ref-handle:active {
      cursor: grabbing
    }

    .ref-lbl {
      font-family: 'Syne', sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--t4)
    }

    .ref-body {
      padding: 5px 10px 10px
    }

    .ref-upload-box {
      width: 100%;
      height: 88px;
      border: 1px dashed var(--b2);
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      background: var(--bg);
      overflow: hidden;
      transition: border-color .15s
    }

    .ref-upload-box:hover {
      border-color: var(--b3)
    }

    .ref-upload-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .ref-dot {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--b2);
      border: 2px solid #080808;
      cursor: crosshair;
      z-index: 30;
      transition: background .15s
    }

    .ref-dot:hover {
      background: var(--b4)
    }

    /* COPY CARD */
    .copy-card {
      width: 190px;
      background: linear-gradient(155deg, #151515, #1a1a1a);
      z-index: 25;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .copy-handle {
      padding: 7px 10px 0;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0
    }

    .copy-handle:active {
      cursor: grabbing
    }

    .copy-lbl {
      font-family: 'Syne', sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--t4)
    }

    .copy-num {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--t4)
    }

    .copy-body {
      padding: 5px 10px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .copy-ta {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 11px;
      color: var(--t2);
      font-family: 'DM Mono', monospace;
      line-height: 1.7;
      resize: none;
      outline: none;
      flex: 1;
      min-height: 72px;
      overflow-y: auto
    }

    .copy-ta::placeholder {
      color: var(--t4)
    }

    /* RESIZE HANDLES */
    .resize-dot {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--b4);
      border: 2px solid var(--bg);
      z-index: 31;
      opacity: 0;
      transition: opacity .15s
    }
    .ca-card:hover .resize-dot { opacity: 1 }
    .rd-n { top: -4px; left: 50%; transform: translateX(-50%); cursor: ns-resize }
    .rd-s { bottom: -4px; left: 50%; transform: translateX(-50%); cursor: ns-resize }
    .rd-w { left: -4px; top: 50%; transform: translateY(-50%); cursor: ew-resize }
    .rd-e { right: 8px; top: 50%; transform: translateY(-50%); cursor: ew-resize }

    .copy-dot {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--b2);
      border: 2px solid #080808;
      cursor: crosshair;
      z-index: 30;
      transition: background .15s
    }

    .copy-dot:hover {
      background: var(--b4)
    }

    /* CONNECTIONS */
    .conn-path {
      fill: none;
      stroke: var(--line-col);
      stroke-width: 1.1;
      cursor: pointer
    }

    .conn-path:hover {
      stroke: rgba(150, 150, 150, .5)
    }

    /* TEMP LINE */
    #temp-svg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: visible
    }

    /* ZOOM */
    #zoom-ctrl {
      position: fixed;
      bottom: 20px;
      left: 66px;
      z-index: 600;
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .zb {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--b2);
      background: var(--bg2);
      color: var(--t3);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      font-family: 'DM Mono', monospace
    }

    .zb:hover {
      background: var(--bg4);
      color: var(--t1)
    }

    #zoom-pct {
      font-size: 8px;
      font-family: 'DM Mono', monospace;
      color: var(--t4);
      text-align: center;
      padding: 2px 0
    }

    /* ADD */
    #add-wrap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 600
    }

    #add-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--b3);
      background: var(--bg3);
      color: var(--t1);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      line-height: 1
    }

    #add-btn:hover {
      background: var(--bg5);
      border-color: var(--b4)
    }

    #add-menu {
      position: absolute;
      bottom: 46px;
      right: 0;
      background: var(--bg2);
      border: 1px solid var(--b2);
      border-radius: 10px;
      padding: 5px;
      min-width: 170px;
      display: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .7)
    }

    #add-menu.open {
      display: block
    }

    .am-item {
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--t2);
      transition: all .15s
    }

    .am-item:hover {
      background: var(--bg4);
      color: var(--t1)
    }

    .am-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0
    }

    /* WF DROPDOWN */
    #wf-drop {
      position: absolute;
      top: 50px;
      left: 60px;
      background: var(--bg2);
      border: 1px solid var(--b2);
      border-radius: 10px;
      padding: 6px;
      min-width: 200px;
      display: none;
      z-index: 800;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .7)
    }

    #wf-drop.open {
      display: block
    }

    .wf-item {
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;

      gap: 8px;

    .wf-acts {

      opacity: 0;

    .wf-item:hover .wf-acts {

    .wa {
      width: 18px;
      height: 18px;
      border: none;
      background: transparent;
      color: var(--t4);
      cursor: pointer;
      font-size: 11px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .wa:hover {
      background: var(--bg5);
      color: var(--t2)
    }

    .wf-new {
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--t4);
      transition: all .15s;
      border-top: 1px solid var(--b1);
      margin-top: 4px;
      padding-top: 10px
    }

    .wf-new:hover {
      color: var(--t2)
    }

    /* LOG VIEW */
    #log-view {
      overflow-y: auto;
      background: var(--bg);
      padding: 20px
    }

    .log-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--t1);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px

    .log-entry {

      background: var(--bg2);
      border: 1px solid var(--b1);
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .log-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .ls-wait {
      background: #444
    }

    .ls-gen {
      background: #888;
      animation: pulse 1s infinite
    }

    .ls-done {
      background: #5a8a5a
    }

    .ls-err {
      background: #8a4a4a
    }

    .log-text {
      font-size: 11px;
      color: var(--t2);
      font-family: 'DM Mono', monospace;
      flex: 1
    }

    .log-time {
      font-size: 10px;
      color: var(--t4);
      font-family: 'DM Mono', monospace
    }

    .log-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      gap: 8px;
      color: var(--t4);
      font-size: 12px
    }

    /* GALLERY VIEW */
    #gallery-view {
      overflow-y: auto;
      background: var(--bg);
      padding: 20px
    }

    .gv-hdr {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px
    }

    .gv-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--t1)
    }

    .gv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px
    }

    .gv-card {
      background: var(--bg2);
      border: 1px solid var(--b1);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all .15s
    }

    .gv-card:hover {
      border-color: var(--b2);
      transform: translateY(-2px)
    }

    .gv-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--bg3);

    }

    .gv-info {
      padding: 8px 10px
    }

    .gv-name {
      font-size: 11px;
      color: var(--t1);
      font-weight: 500
    }

    .gv-date {
      font-size: 10px;
      color: var(--t4);
      font-family: 'DM Mono', monospace;
      margin-top: 2px
    }

    .gv-dl {
      margin-top: 6px;

      border-radius: 5px;
      border: 1px solid var(--b1);

      color: var(--t3);

      transition: all .15s
    }

      color: var(--t1)
    }

    .gf {
      padding: 3px 10px;
      border-radius: 5px;
      border: 1px solid var(--b1);

    /* LIBRARY VIEW */
    #library-view {
      overflow-y: auto;
      background: var(--bg);
      padding: 20px
    }

    .lib-hdr {

      color: var(--t4)

      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));

      align-items: start

    .lib-card {
      background: var(--bg2);
      border: 1px solid var(--b1);
      border-radius: 10px;
      overflow: hidden;

    .lib-card:active {

    .lib-card.dragging {

    .lib-card-img-area {

      background: var(--bg3);

      height: 100%;

      color: var(--t1);

    }

    .sv-stat {

      color: var(--t4)
    }

    .sv-stat.ok {
      color: #6a8a6a
    }

      width: 100%;
      padding: 7px 10px;
      background: var(--bg2);
      border: 1px solid var(--b1);
      border-radius: 7px;
      color: var(--t1);
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      outline: none;
      margin-top: 4px;

      font-weight: 600;

    }

    }

    @keyframes pulse {

      }

      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .spin {
      animation: spin .7s linear infinite;
      display: inline-block
    }

    ::-webkit-scrollbar {
      width: 4px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: var(--b2);
      border-radius: 4px
    }
  </style>
</head>

  <!-- ZOOM -->
  <div id="zoom-ctrl">

    <button class="zb" onclick="resetView()">⊙</button>
  </div>

  <!-- ADD -->
  <div id="add-wrap">

      <div class="am-item" onclick="spawnCard('result');closeAdd()">

  <!-- TEMP LINE -->
  <svg id="temp-svg">
    <line id="temp-line" x1="-1" y1="-1" x2="-1" y2="-1" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" />
  </svg>

  <script>
    /* ═══ GLOBALS ═══ */
    let scale = 1, panX = 0, panY = 0;
    let isPan = false, panStart = { x: 0, y: 0 };
    let dragId = null, dragOff = { x: 0, y: 0 };
    let resizingId = null, resizeDir = null, resizeOrigin = null, resizeDims = null;
    let connFrom = null, connDotEl = null;
    let cards = {};
    let conns = [];
    let zCounter = 50;
    let uidCounter = 1;
    let logEntries = [];
    let genImgs = {};
    let abortControllers = {};
    let genAllAbort = false;
    let libItems = [];
    let libDragIdx = null;
    let workflows = [{ id: 'wf1', name: 'Workflow 1', cards: {}, conns: [], pan: { x: 0, y: 0 }, scale: 1 }];
    let currentWf = 'wf1';

    const canvas = document.getElementById('canvas');
    const svgBack = document.getElementById('svg-back');
    const boardView = document.getElementById('board-view');
    const tempLine = document.getElementById('temp-line');

    function uid() { return uidCounter++ }

    /* ═══ TRANSFORM ═══ */
    function applyTransform() {
      const t = `translate(${panX}px,${panY}px) scale(${scale})`;
      canvas.style.transform = t;
      svgBack.style.transform = t;
      document.getElementById('zoom-pct').textContent = Math.round(scale * 100) + '%';
    }

    function doZoom(factor, cx, cy) {
      const r = boardView.getBoundingClientRect();
      const ox = cx !== undefined ? cx : r.width / 2;
      const oy = cy !== undefined ? cy : r.height / 2;
      const ns = Math.max(0.08, Math.min(4, scale * factor));
      panX = ox - (ox - panX) * (ns / scale);
      panY = oy - (oy - panY) * (ns / scale);
      scale = ns;
      applyTransform();
    }

    function resetView() {
      scale = 0.72; panX = 60; panY = 60;
      applyTransform();
    }

    /* ═══ PAN ═══ */
    boardView.addEventListener('wheel', e => {
      e.preventDefault();
      const r = boardView.getBoundingClientRect();
      doZoom(e.deltaY < 0 ? 1.1 : 0.91, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    boardView.addEventListener('mousedown', e => {
      const t = e.target;
      const isBackground = t === boardView || t === canvas || t === svgBack || t.tagName === 'svg' || t.tagName === 'path' && t.classList.contains('conn-path');
      if (isBackground && !connFrom) {
        isPan = true;
        panStart = { x: e.clientX - panX, y: e.clientY - panY };
        boardView.style.cursor = 'grabbing';
      }
    });

    document.addEventListener('mousemove', e => {
      if (isPan) {
        panX = e.clientX - panStart.x;
        panY = e.clientY - panStart.y;
        applyTransform();
      }
      if (dragId) {
        const r = boardView.getBoundingClientRect();
        const cx = (e.clientX - r.left - panX) / scale;
        const cy = (e.clientY - r.top - panY) / scale;
        const el = document.getElementById(dragId);
        if (el) {
          const nx = cx - dragOff.x;
          const ny = cy - dragOff.y;
          el.style.left = nx + 'px';
          el.style.top = ny + 'px';
          cards[dragId].x = nx;
          cards[dragId].y = ny;
          drawLines();
        }
      }
      if (resizingId) {
        const r = boardView.getBoundingClientRect();
        const cx = (e.clientX - r.left - panX) / scale;
        const cy = (e.clientY - r.top - panY) / scale;
        const dx = cx - resizeOrigin.x;
        const dy = cy - resizeOrigin.y;
        const el = document.getElementById(resizingId);
        if (el) {
          const MIN_W = 130, MIN_H = 80;
          if (resizeDir === 'right') {
            const nw = Math.max(MIN_W, resizeDims.w + dx);
            el.style.width = nw + 'px';
            cards[resizingId].data.width = nw;
          } else if (resizeDir === 'left') {
            const nw = Math.max(MIN_W, resizeDims.w - dx);
            const nx = resizeDims.x + (resizeDims.w - nw);
            el.style.width = nw + 'px';
            el.style.left = nx + 'px';
            cards[resizingId].x = nx;
            cards[resizingId].data.width = nw;
          } else if (resizeDir === 'bottom') {
            const nh = Math.max(MIN_H, resizeDims.h + dy);
            el.style.height = nh + 'px';
            cards[resizingId].data.height = nh;
          } else if (resizeDir === 'top') {
            const nh = Math.max(MIN_H, resizeDims.h - dy);
            const ny = resizeDims.y + (resizeDims.h - nh);
            el.style.height = nh + 'px';
            el.style.top = ny + 'px';
            cards[resizingId].y = ny;
            cards[resizingId].data.height = nh;
          }
          drawLines();
        }
      }
      if (connFrom && connDotEl) {
        const dr = connDotEl.getBoundingClientRect();
        tempLine.setAttribute('x1', dr.left + dr.width / 2);
        tempLine.setAttribute('y1', dr.top + dr.height / 2);
        tempLine.setAttribute('x2', e.clientX);
        tempLine.setAttribute('y2', e.clientY);
      }
    });

    document.addEventListener('mouseup', e => {
      if (isPan) { isPan = false; boardView.style.cursor = 'default' }
      dragId = null;
      if (resizingId) {
        saveCurrentWf();
        resizingId = null; resizeDir = null; resizeOrigin = null; resizeDims = null;
      }
      if (connFrom) {
        tempLine.setAttribute('x1', -1); tempLine.setAttribute('y1', -1);
        tempLine.setAttribute('x2', -1); tempLine.setAttribute('y2', -1);
        const under = document.elementFromPoint(e.clientX, e.clientY);
        const dot = under && (under.classList.contains('cr-dot-left') || under.classList.contains('ref-dot') || under.classList.contains('copy-dot') || under.classList.contains('id-dot'))
          ? under
          : under && under.closest('[data-cid]');
        if (dot && dot.dataset.cid && dot.dataset.cid !== connFrom) {
          addConn(connFrom, dot.dataset.cid);
        }
        connFrom = null; connDotEl = null;
      }
    });

    /* ═══ LINES ═══ */
    function getCardEdges(id) {
      const c = cards[id];
      const el = document.getElementById(id);
      if (!c || !el) return null;
      const w = el.offsetWidth || 200;
      const h = el.offsetHeight || 100;
      return {
        rightX: c.x + w, rightY: c.y + h / 2,
        leftX: c.x, leftY: c.y + h / 2,
        centerX: c.x + w / 2, centerY: c.y + h / 2
      };
    }

    function drawLines() {
      svgBack.innerHTML = '';
      conns.forEach(cn => {
        const f = getCardEdges(cn.from);
        const t = getCardEdges(cn.to);
        if (!f || !t) return;
        const x1 = f.rightX, y1 = f.rightY;
        const x2 = t.leftX, y2 = t.leftY;
        const mx = (x1 + x2) / 2;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
        p.setAttribute('class', 'conn-path');
        p.style.pointerEvents = 'stroke';
        p.addEventListener('dblclick', () => {
          conns = conns.filter(x => x.id !== cn.id);
          drawLines();
        });
        svgBack.appendChild(p);
      });
    }

    function addConn(from, to) {
      if (conns.find(c => c.from === from && c.to === to)) return;
      conns.push({ from, to, id: 'c' + uid() });
      drawLines();
    }

    function clearConns() {
      if (confirm('Limpar todas as conexões?')) { conns = []; drawLines() }
    }

    function autoConnect() {
      const ids = Object.keys(cards);
      const identity = ids.find(id => cards[id].type === 'identity');
      const results = ids.filter(id => cards[id].type === 'result');
      const copies = ids.filter(id => cards[id].type === 'copy');
      const refs = ids.filter(id => cards[id].type === 'ref');
      if (identity) results.forEach(rid => addConn(identity, rid));
      copies.forEach((cid, i) => { if (results[i]) addConn(cid, results[i]) });
      refs.forEach((rfid, i) => { if (results[i]) addConn(rfid, results[i]) });
      drawLines();
    }

    /* ═══ CARD CREATION ═══ */
    function spawnCard(type, x, y, id, data) {
      const cid = id || (type + '_' + uid());
      // Sensible default positions
      let cx = x, cy = y;
      if (cx === undefined) {
        const r = boardView.getBoundingClientRect();
        cx = (-panX / scale) + (r.width / scale) * 0.45 + Math.random() * 100;
        cy = (-panY / scale) + (r.height / scale) * 0.35 + Math.random() * 80;
      }
      cards[cid] = { type, x: cx, y: cy, data: data || {} };

      const wrap = document.createElement('div');
      wrap.id = cid;
      wrap.className = 'ca-card ' + (
        type === 'identity' ? 'identity-card' :
          type === 'result' ? 'cr-card' :
            type === 'ref' ? 'ref-card' :
              'copy-card'
      );
      let styleStr = `left:${cx}px;top:${cy}px;z-index:${type === 'identity' ? 20 : type === 'ref' || type === 'copy' ? 25 : 10}`;
      if (data?.width) styleStr += `;width:${data.width}px`;
      if (data?.height) styleStr += `;height:${data.height}px`;
      wrap.style.cssText = styleStr;

      wrap.innerHTML = buildInnerHTML(type, cid, data || {});
      canvas.appendChild(wrap);

      // Bind drag handle
      const handle = wrap.querySelector('[data-handle]');
      if (handle) {
        handle.addEventListener('mousedown', e => {
          if (e.button !== 0) return;
          e.stopPropagation();
          dragId = cid;
          wrap.style.zIndex = zCounter++;
          const r = boardView.getBoundingClientRect();
          const cx2 = (e.clientX - r.left - panX) / scale;
          const cy2 = (e.clientY - r.top - panY) / scale;
          dragOff = { x: cx2 - cards[cid].x, y: cy2 - cards[cid].y };
        });
      }

      // Bind connect dots
      wrap.querySelectorAll('[data-cid]').forEach(dot => {
        dot.addEventListener('mousedown', e => {
          if (e.button !== 0) return;
          e.stopPropagation();
          connFrom = cid;
          connDotEl = dot;
        });
      });

      // Bind resize dots (copy cards only)
      if (type === 'copy') {
        wrap.querySelectorAll('[data-resize]').forEach(dot => {
          dot.addEventListener('mousedown', e => {
            if (e.button !== 0) return;
            e.stopPropagation();
            resizingId = cid;
            resizeDir = dot.dataset.resize;
            const r = boardView.getBoundingClientRect();
            resizeOrigin = {
              x: (e.clientX - r.left - panX) / scale,
              y: (e.clientY - r.top - panY) / scale
            };
            const el = document.getElementById(cid);
            resizeDims = {
              w: el ? el.offsetWidth : (cards[cid].data.width || 190),
              h: el ? el.offsetHeight : (cards[cid].data.height || 120),
              x: cards[cid].x,
              y: cards[cid].y
            };
          });
        });
      }

      // Right-click to remove (not identity)
      if (type !== 'identity') {
        wrap.addEventListener('contextmenu', e => {
          e.preventDefault();
          if (confirm('Remover este card?')) {
            wrap.remove();
            delete cards[cid];
            conns = conns.filter(c => c.from !== cid && c.to !== cid);
            drawLines();
          }
        });
      }

      setTimeout(() => drawLines(), 30);
      return cid;
    }

    /* ═══ HTML BUILDERS ═══ */
    function buildInnerHTML(type, id, data) {
      if (type === 'identity') return buildIdentity(id, data);
      if (type === 'result') return buildResult(id, data);
      if (type === 'ref') return buildRef(id, data);
      if (type === 'copy') return buildCopy(id, data);
      return '';
    }

        </div>
        <input type="file" accept="image/*" style="display:none" onchange="handleLogo(event,'${id}')">
      </label>
    </div>
  </div>

  <div class="id-section">
    <div class="id-sec-hdr"><div class="id-sec-label">Fontes</div>${tgl('fonts')}</div>
    <div id="id-sc-fonts-${id}"${!on('fonts') ? ' class="id-sc-off"' : ''}>
      <div id="id-fonts-${id}" class="id-chips">

  <div class="id-section">
    <div class="id-sec-hdr"><div class="id-sec-label">Paleta de Cores</div>${tgl('colors')}</div>

        <div class="id-swatch" style="background:#666666" title="#666666"></div>
        <div class="id-swatch-add" onclick="addIdColor('${id}')">+</div>
      </div>
    </div>
  </div>

  <div class="id-section">
    <div class="id-sec-hdr"><div class="id-sec-label">Referências Visuais</div>${tgl('refs')}</div>
    <div id="id-sc-refs-${id}"${!on('refs') ? ' class="id-sc-off"' : ''}>
      <div id="id-refs-${id}" class="id-ref-list">${refsHtml}</div>
      <label style="cursor:pointer;display:block;margin-top:5px">
        <div style="padding:5px 8px;border:1px dashed var(--b2);border-radius:6px;display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t4);transition:border-color .15s"
             onmouseover="this.style.borderColor='var(--b3)'" onmouseout="this.style.borderColor='var(--b2)'">
          <span style="font-size:13px">⊕</span> Adicionar referência
        </div>
        <input type="file" accept="image/*" style="display:none" onchange="handleIdRef(event,'${id}')">
      </label>
    </div>
  </div>

  <div class="id-section" style="border-bottom:none">
    <div class="id-sec-hdr"><div class="id-sec-label">Prompt Base</div>${tgl('prompt')}</div>
    <div id="id-sc-prompt-${id}"${!on('prompt') ? ' class="id-sc-off"' : ''}>
      <textarea class="id-prompt-ta" placeholder="Instruções gerais de identidade visual..." oninput="cards['${id}']&&(cards['${id}'].data.promptBase=this.value);saveCurrentWf()">${data.promptBase || 'Seguir exatamente a paleta de cores e estilo visual da marca. Usar a logo fornecida. Manter coerência visual com as referências de estilo.'}</textarea>
    </div>
  </div>

  <div class="id-dot" data-cid="${id}"></div>`;
    }

    function buildResult(id, data) {
      return `
  <div class="cr-handle" data-handle>
    <span class="cr-lbl">Resultado</span>
    <span class="cr-model" id="cr-mdl-${id}">${document.getElementById('def-model')?.value || 'dall-e-3'}</span>
  </div>
  <div class="cr-body">
    <div class="cr-preview" id="cr-prev-${id}">
      ${genImgs[id]?.url ? `<img src="${genImgs[id].url}" style="width:100%;height:100%;object-fit:cover">` : `
      <div class="cr-empty-wrap">
        <div class="cr-empty-icon">⊡</div>

    <div class="cr-controls">
      <select class="cr-sel" id="cr-q-${id}">
        <option>1</option><option>2</option><option>3</option><option>4</option>
      </select>
      <select class="cr-sel" id="cr-f-${id}">

    <div class="cr-post" id="cr-post-${id}">

    <div class="alter-box" id="alter-${id}">

      <button class="cr-gen-btn" style="margin-top:4px" onclick="genCard('${id}',true)">⚡ REGERAR</button>
    </div>
  </div>

    function buildRef(id, data) {
      return `
  <div class="ref-handle" data-handle>
    <span class="ref-lbl">Referência</span>
  </div>
  <div class="ref-body">
    <label style="cursor:pointer;display:block">
      <div id="ref-box-${id}" class="ref-upload-box">
        ${data.refUrl ? `<img src="${data.refUrl}">` : `<span style="font-size:16px;color:var(--t4)">⊕</span><span style="font-size:9px;color:var(--t4)">Upload imagem</span>`}
      </div>
      <input type="file" accept="image/*" style="display:none" onchange="handleRef(event,'${id}')">
    </label>
  </div>
  <div class="ref-dot" data-cid="${id}"></div>`;

    function buildCopy(id, data) {
      const n = Object.keys(cards).filter(k => cards[k] && cards[k].type === 'copy').length;
      return `
  <div class="resize-dot rd-n" data-resize="top"></div>
  <div class="resize-dot rd-s" data-resize="bottom"></div>
  <div class="resize-dot rd-w" data-resize="left"></div>
  <div class="resize-dot rd-e" data-resize="right"></div>
  <div class="copy-handle" data-handle>
    <span class="copy-lbl">Copy</span>
    <span class="copy-num">#${n}</span>
  </div>
  <div class="copy-body">
    <textarea class="copy-ta" id="copy-ta-${id}" rows="4" placeholder="Texto do anúncio..."
      oninput="cards['${id}']&&(cards['${id}'].data.copy=this.value);saveCurrentWf()">${data.copy||''}</textarea>
  </div>
  <div class="copy-dot" data-cid="${id}"></div>`;
    }

    /* ═══ FILE HANDLERS ═══ */
    function handleLogo(e, id) {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const url = ev.target.result;
        const box = document.getElementById('id-logo-' + id);
        if (box) box.innerHTML = `<img src="${url}" style="max-height:52px;max-width:100%;object-fit:contain;padding:4px">`;
        if (cards[id]) cards[id].data.logoUrl = url;
        saveCurrentWf();
      };
      reader.readAsDataURL(f);
    }
    function handleIdRef(e, id) {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const url = ev.target.result;
        const name = f.name.replace(/\.[^.]+$/, '').slice(0, 22);
        const list = document.getElementById('id-refs-' + id);
        if (list) {
          const item = document.createElement('div');
          item.className = 'id-ref-item';
          item.innerHTML = `<img src="${url}" class="id-ref-img"><span class="id-ref-name">${name}</span><button class="id-ref-del" onclick="this.closest('.id-ref-item').remove()">×</button>`;
          list.appendChild(item);
        }
        if (cards[id]) {
          if (!cards[id].data.idRefs) cards[id].data.idRefs = [];
          cards[id].data.idRefs.push({ url, name });
        }
        saveCurrentWf();
      };
      reader.readAsDataURL(f);
    }
    function handleRef(e, id) {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const url = ev.target.result;
        const box = document.getElementById('ref-box-' + id);
        if (box) box.innerHTML = `<img src="${url}">`;
        if (cards[id]) cards[id].data.refUrl = url;
        saveCurrentWf();
      };
      reader.readAsDataURL(f);
    }
    function addIdFont(id) {
      const name = prompt('Nome da fonte:'); if (!name) return;
      const cont = document.getElementById('id-fonts-' + id); if (!cont) return;
      const chip = document.createElement('div');
      chip.className = 'id-chip'; chip.textContent = name;
      cont.insertBefore(chip, cont.lastElementChild);
    }
    function addIdColor(id) {
      const inp = document.createElement('input'); inp.type = 'color'; inp.value = '#ffffff';
      inp.style.cssText = 'position:fixed;top:-999px;left:-999px;opacity:0;pointer-events:none';
      document.body.appendChild(inp);
      inp.addEventListener('change', () => {
        const cont = document.getElementById('id-colors-' + id); if (!cont) return;
        const sw = document.createElement('div');
        sw.className = 'id-swatch'; sw.style.background = inp.value; sw.title = inp.value;
        cont.insertBefore(sw, cont.lastElementChild);
        document.body.removeChild(inp);
      });
      inp.click();
    }

    /* ═══ TOGGLE IDENTITY SECTIONS ═══ */
    function toggleIdSection(cardId, section, el) {
      if (!cards[cardId]) return;
      if (!cards[cardId].data.idToggles) cards[cardId].data.idToggles = {};
      const isOn = el.classList.contains('on');
      cards[cardId].data.idToggles[section] = !isOn;
      el.classList.toggle('on', !isOn);
      el.title = !isOn ? 'Enviando para IA' : 'Desativado';
      const cont = document.getElementById('id-sc-' + section + '-' + cardId);
      if (cont) cont.classList.toggle('id-sc-off', isOn);
      saveCurrentWf();
    }

    /* ═══ PROMPT BUILDING ═══ */
    function buildPrompt(id) {
      const linked = conns.filter(c => c.to === id).map(c => cards[c.from]).filter(Boolean);
      let idParts = [], copyText = '', hasRef = false;
      linked.forEach(src => {
        if (src.type === 'identity') {
          const idKey = Object.keys(cards).find(k => cards[k].type === 'identity');
          const idEl = idKey ? document.getElementById(idKey) : null;
          const tog = src.data.idToggles || {};
          const on = k => tog[k] !== false;

          if (on('prompt')) {
            const ta = idEl?.querySelector('.id-prompt-ta');
            if (ta?.value) idParts.push(ta.value);
          }
          if (on('fonts') && idEl) {
            const fonts = [...idEl.querySelectorAll('.id-chip')].map(c => c.textContent.trim()).filter(Boolean);
            if (fonts.length) idParts.push(`Fontes da marca: ${fonts.join(', ')}.`);
          }
          if (on('colors') && idEl) {
            const colors = [...idEl.querySelectorAll('.id-swatch[title]')].map(s => s.title).filter(Boolean);
            if (colors.length) idParts.push(`Paleta de cores (hex): ${colors.join(', ')}.`);
          }
          if (on('logo') && src.data.logoUrl) {
            idParts.push('Incorporar a logo da marca ao criativo.');
          }
          if (on('refs') && src.data.idRefs?.length) {
            idParts.push(`Referências de identidade: ${src.data.idRefs.map(r => r.name).join(', ')}.`);
          }
        }
        if (src.type === 'copy' && src.data?.copy) copyText = src.data.copy;
        if (src.type === 'ref') hasRef = true;
      });
      const idText = idParts.join('\n');
      const fmt = document.getElementById('cr-f-' + id)?.value || '1024x1024';
      let p = `Crie uma imagem publicitária de alta qualidade, formato ${fmt}.\n\n`;
      if (idText) p += `IDENTIDADE:\n${idText}\n\n`;
      if (copyText) p += `TEXTO DO ANÚNCIO: "${copyText}"\n\n`;
      if (hasRef) p += `Use o estilo visual da imagem de referência como inspiração.\n\n`;
      if (!idText && !copyText && !hasRef) p += `Seja criativo. Resultado profissional e impactante para marketing digital.\n\n`;
      const alterTa = document.querySelector(`#alter-${id} .alter-ta`);
      if (alterTa?.value) p += `AJUSTES: ${alterTa.value}\n\n`;
      p += `Fotorrealista, profissional, alta qualidade, adequado para redes sociais.`;
      return p;
    }

    /* ═══ GENERATION ═══ */
    async function genCard(id, isRegen) {
      const key = localStorage.getItem('cs_openai_key') || document.getElementById('oai-key').value;
      if (!key) { alert('Configure sua API Key em Configurações.'); return }

      const model = document.getElementById('def-model')?.value || 'dall-e-3';
      const prev = document.getElementById('cr-prev-' + id);
      const genBtn = document.getElementById('cr-gen-' + id);
      const prompt = buildPrompt(id);
      const fmtRaw = document.getElementById('cr-f-' + id)?.value || '1024x1024';

      // gpt-image-1/2 use different size values than dall-e-3
      const sizeRemap = {
        'gpt-image-1': { '1024x1792': '1024x1536', '1792x1024': '1536x1024' },
        'gpt-image-2': { '1024x1792': '1024x1536', '1792x1024': '1536x1024' }
      };
      const fmt = sizeRemap[model]?.[fmtRaw] || fmtRaw;

      const qual = document.getElementById('cr-ql-' + id)?.value || 'standard';
      // gpt-image-1/2 use low/medium/high instead of standard/hd
      const isGptModel = model === 'gpt-image-1' || model === 'gpt-image-2';
      const apiQuality = isGptModel ? (qual === 'hd' ? 'high' : 'medium') : qual;

      const controller = new AbortController();
      abortControllers[id] = controller;

      if (prev) prev.innerHTML = `<div class="cr-empty-wrap"><div class="cr-empty-icon"><span class="spin" style="font-size:20px">↻</span></div><div class="cr-empty-txt">Gerando...</div></div>`;
      if (genBtn) {
        genBtn.classList.remove('busy');
        genBtn.classList.add('stop');
        genBtn.innerHTML = '■ PARAR';
        genBtn.onclick = () => controller.abort();
      }

      const logId = 'log_' + uid();
      logEntries.unshift({ id: logId, status: 'gen', text: `${id} — ${fmtRaw}`, time: new Date().toLocaleTimeString('pt-BR') });
      renderLog();

      const resetBtn = () => {
        if (genBtn) {
          genBtn.classList.remove('stop', 'busy');
          genBtn.innerHTML = '⚡ GERAR';
          genBtn.onclick = () => genCard(id);
        }
        delete abortControllers[id];
      };

      try {
        let imgSrc = null;

        // Check for connected reference image
        const linked = conns.filter(c => c.to === id).map(c => cards[c.from]).filter(Boolean);
        const refCard = linked.find(src => src.type === 'ref' && src.data?.refUrl);

        if (isGptModel && refCard) {
          const dataUrl = refCard.data.refUrl;
          const base64 = dataUrl.split(',')[1];
          const mime = dataUrl.split(';')[0].split(':')[1] || 'image/png';
          const bytes = atob(base64);
          const arr = new Uint8Array(bytes.length);
          for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
          const refBlob = new Blob([arr], { type: mime });

          const fd = new FormData();
          fd.append('image', refBlob, 'reference.png');
          fd.append('prompt', prompt);
          fd.append('model', model);
          fd.append('n', '1');
          fd.append('size', fmt);
          fd.append('quality', apiQuality);

          const res = await fetch('https://api.openai.com/v1/images/edits', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + key },
            body: fd,
            signal: controller.signal
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          imgSrc = data.data[0].b64_json
            ? 'data:image/png;base64,' + data.data[0].b64_json
            : data.data[0].url;
        } else {
          const body = { model, prompt, n: 1, size: fmt, quality: apiQuality, response_format: 'b64_json' };
          const res = await fetch('https://api.openai.com/v1/images/generations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
            body: JSON.stringify(body),
            signal: controller.signal
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          imgSrc = data.data[0].b64_json
            ? 'data:image/png;base64,' + data.data[0].b64_json
            : data.data[0].url;
        }

        genImgs[id] = { url: imgSrc, prompt, ts: Date.now() };
        if (prev) prev.innerHTML = `<img src="${imgSrc}">`;
        resetBtn();
        document.getElementById('cr-post-' + id)?.classList.add('show');
        const le = logEntries.find(l => l.id === logId); if (le) { le.status = 'done'; le.text += ' ✓' }
        renderLog();
        addToGallery(id, imgSrc);
        saveCurrentWf();
      } catch (err) {
        if (err.name === 'AbortError') {
          if (prev) prev.innerHTML = `<div class="cr-empty-wrap"><div class="cr-empty-icon" style="color:var(--t4)">■</div><div class="cr-empty-txt">Geração cancelada</div></div>`;
          const le = logEntries.find(l => l.id === logId); if (le) { le.status = 'err'; le.text += ' cancelado' }
        } else {
          if (prev) prev.innerHTML = `<div class="cr-empty-wrap"><span style="font-size:16px">⚠</span><span style="color:#8a5a5a;font-size:9px">${err.message.slice(0, 55)}</span></div>`;
          const le = logEntries.find(l => l.id === logId); if (le) { le.status = 'err'; le.text += ' ✗' }
        }
        resetBtn();
        renderLog();
      }
    }

    async function genAll() {
      genAllAbort = false;
      const btn = document.getElementById('gen-all-btn');
      if (btn) { btn.innerHTML = '■ Parar tudo'; btn.classList.add('hi'); btn.style.background = '#2a1a1a'; btn.style.borderColor = '#4a2a2a'; btn.style.color = '#c08080'; btn.onclick = stopAll; }
      const results = Object.keys(cards).filter(id => cards[id]?.type === 'result');
      for (const id of results) {
        if (genAllAbort) break;
        await genCard(id);
        if (!genAllAbort) await new Promise(r => setTimeout(r, 1200));
      }
      resetGenAllBtn();
    }

    function stopAll() {
      genAllAbort = true;
      Object.values(abortControllers).forEach(c => c.abort());
      resetGenAllBtn();
    }

    function resetGenAllBtn() {
      genAllAbort = false;
      const btn = document.getElementById('gen-all-btn');
      if (btn) { btn.innerHTML = '⚡ Gerar todos'; btn.style.background = ''; btn.style.borderColor = ''; btn.style.color = ''; btn.onclick = genAll; }
    }

    async function dlCard(id) {
      const d = genImgs[id]; if (!d?.url) { alert('Nenhuma imagem gerada ainda.'); return }

      try {
        const res = await fetch(d.url);
        const blob = await res.blob();
        const localUrl = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = localUrl; a.download = `criativo_${id}_${Date.now()}.png`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(localUrl), 5000);
      } catch (e) {
        // Fallback para abrir a url (se CORS impedir fetch)
        const a = document.createElement('a'); a.href = d.url; a.download = `criativo_${id}_${Date.now()}.png`;
        a.target = '_blank';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }
    }
    function dlAll() { Object.keys(genImgs).forEach((id, i) => setTimeout(() => dlCard(id), i * 600)) }
    function toggleAlter(id) { document.getElementById('alter-' + id)?.classList.toggle('open') }

    /* ═══ SAVE / LOAD PROJECT ═══ */
    function saveProject() {
      saveCurrentWf();
      const state = { version: 2, workflows, currentWf, libItems };
      const json = JSON.stringify(state);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cria-ativos-${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    function loadProject() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const state = JSON.parse(ev.target.result);
            if (!state.workflows) throw new Error('Arquivo inválido.');
            workflows = state.workflows;
            libItems = state.libItems || [];
            currentWf = state.currentWf || workflows[0].id;
            loadWf(currentWf);
            document.getElementById('wf-name').textContent = workflows.find(w => w.id === currentWf)?.name || '';
            renderWfList();
            renderLib();
            saveCurrentWf();
          } catch(err) {
            alert('Erro ao carregar: ' + err.message);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    /* ═══ LOG ═══ */
    function renderLog() {
      const cont = document.getElementById('log-entries'); if (!cont) return;
      if (!logEntries.length) {
        cont.innerHTML = '<div class="log-empty"><span style="font-size:24px;color:var(--t4)">◈</span><span>Nenhuma geração ainda</span></div>';
        return;
      }
      const sc = { waiting: 'ls-wait', gen: 'ls-gen', done: 'ls-done', err: 'ls-err' };
      cont.innerHTML = logEntries.map(l => `
    <div class="log-entry">
      <div class="log-dot ${sc[l.status] || 'ls-wait'}"></div>
      <div class="log-text">${l.text}</div>
      <div class="log-time">${l.time}</div>
    </div>`).join('');
    }

    /* ═══ GALLERY ═══ */
    function addToGallery(id, url) {
      const grid = document.getElementById('gv-grid'); if (!grid) return;
      const date = new Date().toLocaleDateString('pt-BR');
      const ex = grid.querySelector(`[data-gid="${id}"]`);
      const html = `<div class="gv-card" data-gid="${id}"><img class="gv-img" src="${url}"><div class="gv-info"><div class="gv-name">Criativo ${id.split('_')[1] || id}</div><div class="gv-date">${date}</div><button class="gv-dl" onclick="dlCard('${id}')">⬇ Baixar</button></div></div>`;
      if (ex) ex.outerHTML = html; else grid.insertAdjacentHTML('afterbegin', html);
    }

    /* ═══ LIBRARY ═══ */
    function renderLib() {
      const grid = document.getElementById('lib-grid'); if (!grid) return;
      grid.innerHTML = '';
      libItems.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'lib-card';
        card.draggable = true;
        card.innerHTML = `
      <button class="lib-del" onclick="event.stopPropagation();delLibItem(${i})">×</button>
      <label style="cursor:pointer;display:block" class="lib-card-img-area">
        ${item.img ? `<img src="${item.img}" style="width:100%;height:100%;object-fit:cover;display:block">` : `<div class="lib-card-img-empty">⊕</div>`}
        <input type="file" accept="image/*" style="display:none" onchange="libUpload(event,${i})">
      </label>
      <div class="lib-card-body">
        <textarea class="lib-card-ta" placeholder="Anotação..." rows="2"
          oninput="libItems[${i}].text=this.value">${item.text || ''}</textarea>
      </div>`;
        card.addEventListener('dragstart', () => { libDragIdx = i; card.classList.add('dragging') });
        card.addEventListener('dragend', () => { card.classList.remove('dragging'); libDragIdx = null });
        card.addEventListener('dragover', e => e.preventDefault());
        card.addEventListener('drop', e => {
          e.preventDefault();
          if (libDragIdx === null || libDragIdx === i) return;
          const moved = libItems.splice(libDragIdx, 1)[0];
          libItems.splice(i, 0, moved);
          renderLib();
        });
        grid.appendChild(card);
      });
      const addBtn = document.createElement('div');
      addBtn.className = 'lib-add-card'; addBtn.textContent = '+';
      addBtn.onclick = () => { libItems.push({ img: '', text: '' }); renderLib() };
      grid.appendChild(addBtn);
    }
    function libUpload(e, idx) {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => {
        libItems[idx].img = ev.target.result; renderLib();
        saveCurrentWf();
      };
      reader.readAsDataURL(f);
    }
    function delLibItem(idx) { if (confirm('Remover?')) { libItems.splice(idx, 1); renderLib() } }

    /* ═══ WORKFLOWS ═══ */
    function renderWfList() {
      const list = document.getElementById('wf-list'); if (!list) return;
      list.innerHTML = workflows.map(wf => `
    <div class="wf-item ${wf.id === currentWf ? 'cur' : ''}" onclick="switchWf('${wf.id}')">
      <span>⊞</span><span style="flex:1">${wf.name}</span>
      <div class="wf-acts">
        <button class="wa" onclick="event.stopPropagation();renameWf('${wf.id}')">✎</button>
        <button class="wa" onclick="event.stopPropagation();dupWf('${wf.id}')">⊕</button>
        <button class="wa" onclick="event.stopPropagation();delWf('${wf.id}')">×</button>
      </div>
    </div>`).join('');
    }
    function toggleWfDrop() {
      const d = document.getElementById('wf-drop'); d.classList.toggle('open'); renderWfList();
    }
    function saveCurrentWf() {
      const wf = workflows.find(w => w.id === currentWf);
      if (wf) {
        wf.pan = { x: panX, y: panY }; wf.scale = scale;
        // save minimal card data
        wf.cards = {};
        Object.entries(cards).forEach(([id, c]) => {
          wf.cards[id] = { type: c.type, x: c.x, y: c.y, data: c.data || {} };
        });
        wf.conns = conns.slice();
      }
      try {
        localStorage.setItem('CA_workflows', JSON.stringify(workflows));
        localStorage.setItem('CA_current_wf', currentWf);
        localStorage.setItem('CA_libItems', JSON.stringify(libItems));
        try {
          localStorage.setItem('CA_genImgs', JSON.stringify(genImgs));
        } catch (e) {
          console.warn('Imagens geradas não salvas (armazenamento cheio). Faça download antes de fechar.');
        }
      } catch (e) {
        console.warn('Falha ao salvar estado:', e);
      }
    }
    function loadWf(id) {
      canvas.innerHTML = ''; svgBack.innerHTML = ''; cards = {}; conns = [];
      const wf = workflows.find(w => w.id === id); if (!wf) return;
      panX = wf.pan?.x || 0; panY = wf.pan?.y || 0; scale = wf.scale || 1; applyTransform();
      if (wf.cards) {
        // identity first
        Object.entries(wf.cards).filter(([, c]) => c.type === 'identity')
          .forEach(([cid, c]) => spawnCard('identity', c.x, c.y, cid, c.data));
        Object.entries(wf.cards).filter(([, c]) => c.type !== 'identity')
          .forEach(([cid, c]) => spawnCard(c.type, c.x, c.y, cid, c.data));
      }
      conns = (wf.conns || []).map(c => ({ ...c }));
      setTimeout(() => drawLines(), 80);
    }
    function switchWf(id) {
      saveCurrentWf(); currentWf = id; loadWf(id);
      document.getElementById('wf-name').textContent = workflows.find(w => w.id === id)?.name || '';
      document.getElementById('wf-drop').classList.remove('open');
    }
    function newWorkflow() {
      const name = prompt('Nome do workflow:', 'Workflow ' + (workflows.length + 1)); if (!name) return;
      const id = 'wf_' + uid();
      workflows.push({ id, name, cards: {}, conns: [], pan: { x: 0, y: 0 }, scale: 1 });
      switchWf(id);
      document.getElementById('wf-drop').classList.remove('open');
    }
    function renameWf(id) {
      const wf = workflows.find(w => w.id === id); if (!wf) return;
      const n = prompt('Novo nome:', wf.name);
      if (n) { wf.name = n; if (id === currentWf) document.getElementById('wf-name').textContent = n }
      renderWfList();
    }
    function dupWf(id) {
      const wf = workflows.find(w => w.id === id); if (!wf) return;
      const nid = 'wf_' + uid();
      workflows.push({ ...JSON.parse(JSON.stringify(wf)), id: nid, name: wf.name + ' (cópia)' });
      renderWfList();
    }
    function delWf(id) {
      if (workflows.length === 1) { alert('Último workflow, não pode remover.'); return }
      if (!confirm('Remover este workflow?')) return;
      workflows = workflows.filter(w => w.id !== id);
      if (currentWf === id) switchWf(workflows[0].id);
      else renderWfList();
    }

    /* ═══ NAV ═══ */
    function nav(viewName, btn) {
      document.querySelectorAll('.sb-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(viewName + '-view').classList.add('active');
      if (viewName === 'log') renderLog();
      if (viewName === 'library') renderLib();
    }
    function closeAdd() { document.getElementById('add-menu').classList.remove('open') }
    document.addEventListener('click', e => {
      if (!e.target.closest('#add-wrap')) closeAdd();
      if (!e.target.closest('#wf-drop') && !e.target.closest('#wf-btn'))
        document.getElementById('wf-drop').classList.remove('open');
    });

    /* ═══ GALLERY FILTER ═══ */
    function filterGallery(filter, btn) {
      document.querySelectorAll('.gf').forEach(b => b.classList.remove('on'));
      if (btn) btn.classList.add('on');
      const grid = document.getElementById('gv-grid'); if (!grid) return;
      const today = new Date().toLocaleDateString('pt-BR');
      const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
      grid.querySelectorAll('.gv-card').forEach(card => {
        if (filter === 'all') { card.style.display = ''; return; }
        const dateText = card.querySelector('.gv-date')?.textContent || '';
        if (filter === 'today') {
          card.style.display = dateText === today ? '' : 'none';
        } else {
          const parts = dateText.split('/');
          if (parts.length < 3) { card.style.display = 'none'; return; }
          const cardDate = new Date(+parts[2], +parts[1] - 1, +parts[0]);
          card.style.display = cardDate >= weekAgo ? '' : 'none';
        }
      });
    }

    /* ═══ SETTINGS ═══ */
    function saveKey() {
      const k = document.getElementById('oai-key').value;
      localStorage.setItem('cs_openai_key', k);
      const stat = document.getElementById('api-stat');
      if (stat) { stat.textContent = '● Configurada'; stat.className = 'sv-stat ok' }
    }
    const sk = localStorage.getItem('cs_openai_key');
    if (sk && document.getElementById('oai-key')) {
      document.getElementById('oai-key').value = sk;
      const stat = document.getElementById('api-stat');
      if (stat) { stat.textContent = '● Configurada'; stat.className = 'sv-stat ok' }
    }

    /* ═══ INIT ═══ */
    function initDefault() {
      // Restore state if available
      try {
        const savedWfs = localStorage.getItem('CA_workflows');
        const savedLib = localStorage.getItem('CA_libItems');
        const savedImgs = localStorage.getItem('CA_genImgs');

        if (savedWfs) workflows = JSON.parse(savedWfs);
        if (savedLib) libItems = JSON.parse(savedLib);
        if (savedImgs) genImgs = JSON.parse(savedImgs);

        if (savedWfs) {
          const cwf = localStorage.getItem('CA_current_wf') || workflows[0].id;
          currentWf = cwf;
          loadWf(cwf);
          document.getElementById('wf-name').textContent = workflows.find(w => w.id === cwf)?.name || '';
          renderWfList();
          renderLib();
          Object.entries(genImgs).forEach(([id, img]) => addToGallery(id, img.url));
          return;
        }
      } catch (e) {}

      // Default layout if completely clean
      scale = 0.72; panX = 60; panY = 60;
      applyTransform();

      // Identity card on the left
      const iid = spawnCard('identity', 10, 0);

      // 10 result cards: 2 rows of 5, starting at x=260
      const resultIds = [];
      const colGap = 260, rowGap = 370;
      for (let i = 0; i < 10; i++) {
        const col = i % 5, row = Math.floor(i / 5);
        const rid = spawnCard('result', 260 + col * colGap, row * rowGap + 30);
        resultIds.push(rid);
      }

      // 5 ref cards: above row 1 results
      for (let i = 0; i < 5; i++) {
        const rfid = spawnCard('ref', 260 + i * colGap, -160);
        addConn(rfid, resultIds[i]);
      }

      // 5 copy cards: below row 2 results
      for (let i = 0; i < 5; i++) {
        const cpid = spawnCard('copy', 260 + i * colGap, rowGap * 2 + 50);
        const numEl = document.querySelector(`#${cpid} .copy-num`);
        if (numEl) numEl.textContent = '#' + (i + 1);
        addConn(cpid, resultIds[i]);
      }

      // Connect identity to all results
      resultIds.forEach(rid => addConn(iid, rid));
      drawLines();

      // Seed library
      libItems = [
        { img: '', text: 'Pose: pessoa olhando para câmera' },
        { img: '', text: 'Referência: flat lay produto' },
        { img: '', text: 'Estilo: minimalista fundo branco' },
        { img: '', text: 'Composição: regra dos terços' },
        { img: '', text: 'Lighting: luz natural lateral' },
        { img: '', text: 'Mood: profissional e limpo' },
      ];
      
      saveCurrentWf();
    }

    // Run after DOM fully ready
    window.addEventListener('load', () => {
      initDefault();
    });
  </script>
</body>

</html>
